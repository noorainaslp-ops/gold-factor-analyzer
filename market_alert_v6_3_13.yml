name: Multi-Factor Market Alert V6.3.13

on:
  workflow_dispatch:
  schedule:
    # 15:10 IST = 09:40 UTC, Monday-Friday
    - cron: '40 9 * * 1-5'

permissions:
  contents: read

jobs:
  market-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_v6_3_13.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_v6_3_13.txt

      - name: Run V6.3.13 market alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_CAPITAL: ${{ secrets.ALERT_CAPITAL }}
          MAX_RISK_PCT: ${{ secrets.MAX_RISK_PCT }}
          MAX_POSITION_PCT: ${{ secrets.MAX_POSITION_PCT }}
          SLIPPAGE_BPS: ${{ secrets.SLIPPAGE_BPS }}
          ROUND_TRIP_COST_BPS: ${{ secrets.ROUND_TRIP_COST_BPS }}
          TOP_N: ${{ secrets.TOP_N }}
        run: python market_engine_v6_3_13.py

      - name: Upload alert audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v6-3-13-market-alert-audit
          path: audit/
          if-no-files-found: warn
          retention-days: 30

name: Market Alert V6.1

on:
  workflow_dispatch:

  schedule:
    # 08:45 IST = 03:15 UTC
    # Monday to Friday
    - cron: "15 3 * * 1-5"

jobs:

  market-alert:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements_v6_1.txt

      - name: Run Market Alert V6.1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Change this to your actual experimental capital.
          CAPITAL_INR: "100000"

          # Maximum planned loss per trade = 0.50% of capital.
          RISK_PER_TRADE_PCT: "0.50"

          TOP_N: "3"

        run: |
          python market_engine_v6_1.py

      - name: Save audit history
        run: |

          git config user.name "market-alert-bot"

          git config user.email "actions@users.noreply.github.com"

          git add \
            alert_history_v6_1.csv \
            candidate_history_v6_1.csv \
            missed_opportunities_v6_1.csv \
            || true

          git diff --cached --quiet \
            || git commit \
            -m "Update V6.1 market alert history"

          git push || true

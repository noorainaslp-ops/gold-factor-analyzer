name: V6.3.9 Market Alert

on:
  workflow_dispatch:

  schedule:
    # 10:15 AM IST
    # 04:45 UTC
    # Monday-Friday
    - cron: "45 4 * * 1-5"

permissions:
  contents: write

jobs:

  market-alert:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python --version
          pip --version
          pwd
          ls -la

      - name: Verify V6.3.9 files
        run: |
          test -f market_engine_v6_3_9.py
          test -f backtest_v6_3_9.py
          test -f requirements.txt

          echo "All V6.3.9 files found."

      - name: Validate market engine
        run: |
          python -m py_compile market_engine_v6_3_9.py

      - name: Validate backtest
        run: |
          python -m py_compile backtest_v6_3_9.py

      - name: Run V6.3.9 market engine
        env:
          ALERT_CAPITAL: ${{ secrets.ALERT_CAPITAL }}
          MAX_RISK_PER_TRADE: ${{ secrets.MAX_RISK_PER_TRADE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python market_engine_v6_3_9.py

      - name: Upload V6.3.9 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-3-9-market-alert-audit
          path: audit/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit audit files
        if: success()
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audit/ || true

          if git diff --cached --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "Update V6.3.9 market alert audit"
            git push
          fi

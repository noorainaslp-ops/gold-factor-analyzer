name: Market Alert V6.3.2

on:
  workflow_dispatch:

  schedule:
    # 10:15 AM IST = 04:45 UTC
    # Monday-Friday
    - cron: "45 4 * * 1-5"

permissions:
  contents: write

jobs:

  market-alert:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate V6.3.2 Python code
        run: |
          python -m py_compile market_engine_v6_3_2.py

      - name: Run Market Alert V6.3.2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ALERT_CAPITAL: ${{ secrets.ALERT_CAPITAL }}
          ALERT_RISK_PCT: ${{ secrets.ALERT_RISK_PCT }}
          ALERT_MAX_POSITION_PCT: ${{ secrets.ALERT_MAX_POSITION_PCT }}

        run: |
          python market_engine_v6_3_2.py

      - name: Save audit history
        if: always()
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audit/ || true

          if git diff --cached --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "Update V6.3.2 market alert audit"
            git push
          fi

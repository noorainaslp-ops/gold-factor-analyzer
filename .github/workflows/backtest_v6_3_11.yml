name: V6.3.11 Walk Forward Backtest

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * 6"

permissions:
  contents: read

jobs:

  backtest:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify files
        run: |
          test -f market_engine_v6_3_11.py
          test -f backtest_v6_3_11.py
          test -f requirements.txt

      - name: Compile engine
        run: |
          python -m py_compile market_engine_v6_3_11.py

      - name: Compile backtest
        run: |
          python -m py_compile backtest_v6_3_11.py

      - name: Run V6.3.11 backtest
        run: |
          python backtest_v6_3_11.py

      - name: Upload backtest results
        uses: actions/upload-artifact@v6
        with:
          name: v6-3-11-backtest-results
          path: audit/
          if-no-files-found: error
          retention-days: 90

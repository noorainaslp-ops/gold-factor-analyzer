name: Market Alert V6.3.6

on:

  workflow_dispatch:

  schedule:

    # 10:30 AM IST = 05:00 UTC
    - cron: "0 5 * * 1-5"


jobs:

  market-alert:

    runs-on: ubuntu-latest

    env:

      # IMPORTANT:
      # These are deliberately explicit so that the Python
      # program never receives an empty trading-capital value.

      TRADING_CAPITAL: "100000"

      MAX_RISK_PCT: "0.01"

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}


    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: "pip"


      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ------------------------------------------------------
      # VALIDATE PYTHON
      # ------------------------------------------------------

      - name: Validate V6.3.6 engine

        run: |

          python -m py_compile market_engine_v6_3_6.py


      # ------------------------------------------------------
      # RUN ENGINE
      # ------------------------------------------------------

      - name: Run V6.3.6 market engine

        run: |

          python market_engine_v6_3_6.py


      # ------------------------------------------------------
      # SAVE AUDIT
      # ------------------------------------------------------

      - name: Save audit history

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: market-alert-v6-3-6-audit

          path: audit/

          if-no-files-found: ignore

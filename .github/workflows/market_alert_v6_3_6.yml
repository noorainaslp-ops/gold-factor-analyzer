name: Market Alert V6.3.6

on:
  workflow_dispatch:

  schedule:
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:

  market-alert:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_v6_3_6.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_v6_3_6.txt

      - name: Validate engine syntax
        run: |
          python -m py_compile market_engine_v6_3_6.py

      - name: Run V6.3.6 market engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_CAPITAL: ${{ secrets.TRADING_CAPITAL }}
          MAX_RISK_PCT: ${{ secrets.MAX_RISK_PCT }}
        run: |
          python market_engine_v6_3_6.py

      - name: Upload V6.3.6 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V6.3.6-market-audit
          path: audit/
          if-no-files-found: warn

      - name: Save audit files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audit/ || true

          if git diff --cached --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "Add V6.3.6 market alert audit"
            git push
          fi

name: V6.3.16 Chronological Walk-Forward Backtest

on:
  workflow_dispatch:

  push:
    paths:
      - "backtest_v6_3_16.py"
      - "requirements.txt"
      - ".github/workflows/v6_3_16_backtest.yml"

permissions:
  contents: read

jobs:

  backtest:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify required files
        run: |
          test -f requirements.txt
          test -f backtest_v6_3_16.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile backtest_v6_3_16.py

      - name: Run V6.3.16 backtest
        env:
          BACKTEST_PERIOD: "6y"
          CAL_WINDOW: "8000"
          MIN_CAL: "250"
          OOS_FRACTION: "0.20"
          COST_BPS: "10"
          SLIPPAGE_BPS: "5"
        run: |
          python backtest_v6_3_16.py

      - name: Upload V6.3.16 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-3-16-backtest-results
          path: audit/
          if-no-files-found: warn
          retention-days: 30

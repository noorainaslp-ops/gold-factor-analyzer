name: Market Alert V6.2

on:
  workflow_dispatch:

  schedule:
    # 08:45 IST = 03:15 UTC
    - cron: "15 3 * * 1-5"

permissions:
  contents: write

jobs:
  market-alert:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # 1. Checkout repository
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------
      # 2. Setup Python
      # -----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------------
      # 3. Install dependencies
      # -----------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_v6_2.txt

      # -----------------------------------------
      # 4. Validate Python syntax
      # -----------------------------------------
      - name: Validate Market Engine V6.2
        run: |
          python -m py_compile market_engine_v6_2.py

      # -----------------------------------------
      # 5. Run Market Alert
      # -----------------------------------------
      - name: Run Market Alert V6.2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: ${{ secrets.CAPITAL }}
          TOP_N: "3"
        run: |
          python market_engine_v6_2.py

      # -----------------------------------------
      # 6. Save audit/history files
      # -----------------------------------------
      - name: Save audit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            alert_history_v6_2.csv \
            candidate_history_v6_2.csv \
            missed_opportunities_v6_2.csv \
            backtest_v6_2_trades.csv \
            2>/dev/null || true

          git diff --cached --quiet || git commit -m "Update Market Alert V6.2 history"

          git push || true

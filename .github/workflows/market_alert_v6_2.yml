name: Market Alert V6.2

on:
  workflow_dispatch:

  schedule:
    # 08:45 IST = 03:15 UTC
    - cron: "15 3 * * 1-5"

permissions:
  contents: write

jobs:
  market-alert:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_v6_2.txt

      # ======================================================
      # 4. VERIFY FILES
      # ======================================================

      - name: Verify V6.2 files
        run: |
          echo "Repository:"
          pwd
          echo ""
          echo "Files:"
          ls -la
          echo ""
          echo "Workflow directory:"
          ls -la .github/workflows
          echo ""
          test -f market_engine_v6_2.py
          test -f requirements_v6_2.txt

      # ======================================================
      # 5. PYTHON SYNTAX CHECK
      # ======================================================

      - name: Validate Market Engine V6.2
        run: |
          python -m py_compile market_engine_v6_2.py

      # ======================================================
      # 6. RUN ENGINE
      # ======================================================

      - name: Run Market Alert V6.2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # If CAPITAL is not configured, the Python program
          # automatically uses ₹100000.
          CAPITAL: ${{ secrets.CAPITAL }}

          TOP_N: "3"

        run: |
          python market_engine_v6_2.py

      # ======================================================
      # 7. SAVE HISTORY
      # ======================================================

      - name: Save audit history
        if: always()
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            alert_history_v6_2.csv \
            candidate_history_v6_2.csv \
            missed_opportunities_v6_2.csv \
            backtest_v6_2_trades.csv \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update Market Alert V6.2 history"
            git push
          fi

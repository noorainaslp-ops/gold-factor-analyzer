name: Market Alert V6.3.3 Backtest

on:

  workflow_dispatch:


permissions:

  contents: write


jobs:

  backtest:

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # VALIDATE LIVE ENGINE
      # ======================================================

      - name: Validate V6.3.2 engine

        run: |

          python -m py_compile \
            market_engine_v6_3_2.py


      # ======================================================
      # VALIDATE BACKTEST
      # ======================================================

      - name: Validate V6.3.3 backtest

        run: |

          python -m py_compile \
            backtest_v6_3_3.py


      # ======================================================
      # RUN BACKTEST
      # ======================================================

      - name: Run V6.3.3 walk-forward backtest

        run: |

          python backtest_v6_3_3.py


      # ======================================================
      # SAVE AUDIT FILES
      # ======================================================

      - name: Save backtest audit

        if: always()

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add audit/ || true

          if git diff --cached --quiet; then

            echo "No audit changes to commit."

          else

            git commit \
              -m "Add V6.3.3 walk-forward backtest"

            git push

          fi

name: V6.4.1 Market Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V6.4.1 leakage-proof backtest
        env:
          MODE: BACKTEST
          BACKTEST_PERIOD: 6y

          CAPITAL: "100000"
          MAX_POSITIONS: "3"
          PORTFOLIO_HORIZON: "5"

          COST_BPS: "10"
          SLIPPAGE_BPS: "5"

          MIN_HISTORY: "220"
          MIN_TRAIN: "2000"

          VALIDATION_FRACTION: "0.20"
          OOS_FRACTION: "0.20"

        run: |
          python V6_4_1_leakage_proof_market_alert.py

      - name: Upload V6.4.1 audit files
        uses: actions/upload-artifact@v4
        with:
          name: V6.4.1-backtest-audit
          path: audit/
          if-no-files-found: error
          retention-days: 30

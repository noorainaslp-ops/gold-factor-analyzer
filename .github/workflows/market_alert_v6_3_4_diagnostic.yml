name: Market Alert V6.3.4 Diagnostic Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  diagnostic-backtest:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate V6.3.2 engine
        run: |
          python -m py_compile market_engine_v6_3_2.py

      - name: Validate V6.3.4 diagnostic
        run: |
          python -m py_compile backtest_v6_3_4.py

      - name: Run V6.3.4 diagnostic backtest
        run: |
          python backtest_v6_3_4.py

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V6.3.4-diagnostic-results
          path: audit/

      - name: Save diagnostic audit to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audit/ || true

          if git diff --cached --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "Add V6.3.4 diagnostic backtest audit"
            git push
          fi

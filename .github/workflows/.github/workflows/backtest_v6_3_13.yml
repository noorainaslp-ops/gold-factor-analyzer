name: V6.3.13 Chronological Walk-Forward Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements_v6_3_13.txt ]; then
            pip install -r requirements_v6_3_13.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy yfinance requests
          fi

      - name: Create audit directory
        run: |
          mkdir -p audit

      - name: Run V6.3.13 chronological walk-forward backtest
        run: |
          python backtest_v6_3_13.py

      - name: Display generated audit files
        if: always()
        run: |
          echo "=============================================="
          echo "V6.3.13 AUDIT FILES"
          echo "=============================================="

          if [ -d audit ]; then
            find audit -maxdepth 1 -type f -print | sort
          else
            echo "No audit directory found."
          fi

      - name: Upload V6.3.13 backtest results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v6-3-13-backtest-results
          path: |
            audit/**
          if-no-files-found: warn
          retention-days: 90

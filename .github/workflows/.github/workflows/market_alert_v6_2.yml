name: Market Alert V6.2

on:
  workflow_dispatch:

  schedule:
    # 08:45 IST = 03:15 UTC
    # Pre-market short-term plan.
    - cron: "15 3 * * 1-5"

jobs:

  market-alert:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # PYTHON
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_v6_2.txt

      # --------------------------------------------------
      # VALIDATE PYTHON FILE BEFORE RUNNING
      # --------------------------------------------------

      - name: Validate Market Engine V6.2
        run: |
          python -m py_compile market_engine_v6_2.py

      # --------------------------------------------------
      # RUN MARKET ALERT
      # --------------------------------------------------

      - name: Run Market Alert V6.2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_N: "3"
          CAPITAL: "100000"
        run: |
          python market_engine_v6_2.py

      # --------------------------------------------------
      # SAVE HISTORY
      # --------------------------------------------------

      - name: Save V6.2 audit history
        run: |

          git config user.name "market-alert-bot"

          git config user.email \
            "actions@users.noreply.github.com"

          git add \
            alert_history_v6_2.csv \
            candidate_history_v6_2.csv \
            missed_opportunities_v6_2.csv \
            backtest_v6_2_trades.csv \
            || true

          git diff --cached --quiet \
            || git commit \
              -m "Update V6.2 market alert history"

          git push || true

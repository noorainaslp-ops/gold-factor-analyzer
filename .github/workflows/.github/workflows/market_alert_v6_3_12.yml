name: Market Alert V6.3.12

on:

  workflow_dispatch:

  schedule:
    - cron: "15 5 * * 1-5"

permissions:
  contents: write

jobs:

  market-alert:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify V6.3.12 engine
        run: |
          test -f market_engine_v6_3_12.py
          python -m py_compile market_engine_v6_3_12.py

      - name: Run V6.3.12 market alert
        env:
          ALERT_CAPITAL: ${{ secrets.ALERT_CAPITAL }}
          MAX_RISK_PCT: ${{ secrets.MAX_RISK_PCT }}
          MAX_POSITION_PCT: ${{ secrets.MAX_POSITION_PCT }}
          SLIPPAGE_BPS: ${{ secrets.SLIPPAGE_BPS }}
          ROUND_TRIP_COST_BPS: ${{ secrets.ROUND_TRIP_COST_BPS }}
          TOP_N: ${{ secrets.TOP_N }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python market_engine_v6_3_12.py

      - name: Upload V6.3.12 alert audit
        uses: actions/upload-artifact@v6
        with:
          name: v6-3-12-market-alert
          path: audit/
          if-no-files-found: warn
          retention-days: 30

name: Market Alert V6.3.8

on:

  workflow_dispatch:

  schedule:

    # 10:30 AM IST
    # = 05:00 UTC
    # Monday-Friday
    - cron: "0 5 * * 1-5"


jobs:

  market-alert:

    runs-on: ubuntu-latest

    env:

      TRADING_CAPITAL: "100000"

      MAX_RISK_PCT: "0.01"

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}


    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: "pip"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Validate V6.3.8 engine

        run: |

          python -m py_compile market_engine_v6_3_8.py


      - name: Run V6.3.8 market engine

        run: |

          python market_engine_v6_3_8.py


      - name: Save market audit

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: market-alert-v6-3-8-audit

          path: audit/

          if-no-files-found: ignore


  backtest:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Validate V6.3.8 backtest

        run: |

          python -m py_compile backtest_v6_3_8.py


      - name: Run V6.3.8 calibration backtest

        run: |

          python backtest_v6_3_8.py


      - name: Save V6.3.8 backtest

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: v6-3-8-backtest-results

          path: audit/

          if-no-files-found: ignore

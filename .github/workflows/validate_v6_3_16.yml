name: Validate V6.3.16 Files

on:

  workflow_dispatch:

  push:
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f requirements.txt
          test -f backtest_v6_3_16.py
          test -f market_engine_v6_3_16.py

      - name: Compile Python files
        run: |
          python -m py_compile backtest_v6_3_16.py
          python -m py_compile market_engine_v6_3_16.py

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Final validation
        run: |
          python -m py_compile backtest_v6_3_16.py
          python -m py_compile market_engine_v6_3_16.py
          echo "V6.3.16 validation successful."
